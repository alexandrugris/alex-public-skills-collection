<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anti-sample · every rule broken once</title>
<style>
  body { background: #ffffff; color: #1f2937; font-family: helvetica, arial, sans-serif; }
  h1 { font-family: georgia, serif; font-weight: 800; text-transform: uppercase; }
  h2.cool {
    background: linear-gradient(90deg, #ff5f6d, #ffc371);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  .card { border: 1px dashed #999; background-color: white; }
  main p { text-align: center; }
  h3 { font-weight: 700; border-bottom: 3px double #8d2829; }
</style>
</head>
<body>
  <main>
    <h1>🚀 The Future of Amazing Documents</h1>
    <h2 class="cool">Gradient headline with a shadow</h2>
    <div class="card">
      <p>Every mechanical rule broken once, so the checker has something to find.</p>
    </div>
    <h3>A doubled rule under a bold heading</h3>
    <p>Centred body copy, white ground, heavy display type.</p>
  </main>
</body>
</html>
