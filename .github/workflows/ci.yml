name: Skill Gates & Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full offline gate suite
        run: bash run_all.sh
